<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Chat Milanesas</title>
<style>
  body{margin:0;background:#0b141a;font-family:"Roboto","Helvetica Neue","DejaVu Sans",Arial,sans-serif}
  .chat{width:1169px;padding:0 0 30px;box-sizing:border-box;
    background:#0b141a radial-gradient(circle at 20% 30%,#111c22 0 2px,transparent 3px) 0 0/60px 60px}
  .row{padding:0 0 0 138px}
  .bubble{display:inline-block;background:#1f2c34;color:#e9edef;border-radius:22px;
    padding:22px 30px 18px 30px;margin-top:14px;font-size:36px;line-height:1.35;position:relative;max-width:830px}
  .bubble .t{font-size:24px;color:#8696a0;float:right;margin:22px 0 -8px 36px}
  .bubble.last{border-top-left-radius:22px;border-bottom-left-radius:4px}
  .photo{width:757px;height:488px;border-radius:0 0 22px 22px;border:6px solid #1f2c34;border-top:0;
    background:url(original.jpg) -144px 0 / 1169px 993px no-repeat;position:relative;box-sizing:border-box}
  .photo .t{position:absolute;right:24px;bottom:16px;color:#fff;font-size:26px;text-shadow:0 1px 3px #000}
</style></head><body>
<div class="chat" id="chat">
  <div class="row"><div class="photo"></div></div>
  <div class="row"><div class="bubble">MATIAS VOS SOS PELOTUDO?<span class="t">16:13</span></div></div>
  <div class="row"><div class="bubble">Como vas a gastar 40 lucas<br>en un ramo de flores????<span class="t">16:13</span></div></div>
  <div class="row"><div class="bubble">Con esa plata comprábamos 5 kilos<br>de milanesas y comíamos todo el mes<span class="t">16:14</span></div></div>
  <div class="row"><div class="bubble">Y encima con puré 😤<span class="t">16:14</span></div></div>
  <div class="row"><div class="bubble last">QUE HAGO YO CON ESTO? LO EMPANO?<span class="t">16:15</span></div></div>
</div>
</body></html>
